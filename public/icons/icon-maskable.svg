<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e50914" />
      <stop offset="60%" stop-color="#b8001f" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>
    <linearGradient id="film-grad-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f1f7" />
    </linearGradient>
  </defs>

  <!-- Full bleed background for maskable format -->
  <rect width="512" height="512" fill="url(#bg-grad-mask)" />

  <!-- Center Film Icon within safe zone (80% scale centered) -->
  <g transform="translate(156, 156)">
    <rect x="0" y="0" width="200" height="200" rx="36" fill="url(#film-grad-mask)" />
    
    <rect x="24" y="24" width="40" height="40" rx="10" fill="#0a0a0f" />
    <rect x="136" y="24" width="40" height="40" rx="10" fill="#0a0a0f" />
    <rect x="24" y="136" width="40" height="40" rx="10" fill="#0a0a0f" />
    <rect x="136" y="136" width="40" height="40" rx="10" fill="#0a0a0f" />

    <polygon points="88,72 88,128 132,100" fill="#e50914" />
  </g>
</svg>
