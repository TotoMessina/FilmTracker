<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e50914" />
      <stop offset="60%" stop-color="#b8001f" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>
    <linearGradient id="film-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f1f7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Outer film reel glow -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="8" />

  <!-- Center Film / Clapperboard Icon -->
  <g transform="translate(136, 136)" filter="url(#shadow)">
    <!-- Film Reel Center -->
    <rect x="20" y="20" width="200" height="200" rx="36" fill="url(#film-grad)" />
    
    <!-- Cutout Holes resembling Film / Reel -->
    <rect x="44" y="44" width="40" height="40" rx="10" fill="#0a0a0f" />
    <rect x="156" y="44" width="40" height="40" rx="10" fill="#0a0a0f" />
    <rect x="44" y="156" width="40" height="40" rx="10" fill="#0a0a0f" />
    <rect x="156" y="156" width="40" height="40" rx="10" fill="#0a0a0f" />

    <!-- Center Play Triangle (Cinema vibe) -->
    <polygon points="108,92 108,148 152,120" fill="#e50914" />
  </g>

  <!-- Star accents -->
  <circle cx="96" cy="96" r="8" fill="#ffd700" fill-opacity="0.8" />
  <circle cx="416" cy="96" r="6" fill="#ffd700" fill-opacity="0.6" />
</svg>
